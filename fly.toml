# fly.toml app configuration file generated for food-fest on 2026-05-02T11:43:46-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'food-fest'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_PATH = '/data/food-fest.db'
  PORT = '8080'

[[mounts]]
  source = 'food_fest_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
